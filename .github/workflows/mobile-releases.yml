name: Android and iPhone releases

on:
  push:
    tags: ['mobile/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example 0.2.0. Manual runs save artifacts without publishing.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source and version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 -m unittest discover -s tools/mobile -p 'test_*.py' -v
          python3 tools/mobile/release.py metadata --ref="$GITHUB_REF" --version="$INPUT_VERSION"

  checks:
    needs: metadata
    uses: ./.github/workflows/desktop-android.yml

  iphone:
    needs: metadata
    permissions:
      contents: write # Allows the legacy iOS publisher; the called build itself has read access.
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ needs.metadata.outputs.version }}

  android:
    name: Build signed Android release
    needs: [metadata, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOTION_AIR_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 tools/mobile/release.py restore-key --output="$RUNNER_TEMP/motion-air-release.jks"
      - name: Build, test and verify signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/motion-air-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash gradlew --no-daemon assembleRelease testReleaseUnitTest lintRelease
          python3 ../tools/mobile/release.py verify-apk --apk=app/build/outputs/apk/release/app-release.apk \
            --certificate=release-signing-certificate.pem --apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          mkdir -p "$RUNNER_TEMP/android-release"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/android-release/MotionAir-$MOTION_AIR_VERSION-android.apk"
          cp app/build/outputs/apk/release/output-metadata.json "$RUNNER_TEMP/android-release/android-build-info.json"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/motion-air-release.jks"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MotionAir-Android-release
          path: ${{ runner.temp }}/android-release/*
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Assemble verified downloads
    needs: [metadata, checks, iphone, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.iphone.outputs.artifact_name }}
          path: iphone
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: MotionAir-Android-release
          path: android-release
      - name: Verify and package release downloads
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 tools/mobile/release.py bundle --version="$VERSION" --iphone=iphone --android=android-release --output=dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MotionAir-complete-release
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    needs: [metadata, bundle]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: MotionAir-complete-release
          path: dist
      - name: Publish both apps together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag. Use a new version; existing downloads are never replaced.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./* --draft --verify-tag \
            --title "Motion Air $VERSION - Android and iPhone" --notes-file RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
