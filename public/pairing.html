<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Motion Air</title><link rel="icon" href="/motion-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/pairing.css"><script src="/pairing.js" defer></script></head>
<body>
<header class="top"><a class="brand" href="/" aria-label="Motion Air home"><img src="/motion-mark.svg" width="48" height="48" alt=""><span>Motion Air</span></a><div class="top-actions"><span id="connection" class="status" role="status"><span class="status-dot"></span><span id="connection-label">…</span></span><label class="language"><span data-i18n="language">Language</span><select id="language"><option value="en">English</option><option value="es">Español</option></select></label></div></header>
<main>
<section class="intro"><p class="eyebrow" data-i18n="tag"></p><h1 data-i18n="title"></h1><p class="intro-copy" data-i18n="instructions"></p></section>
<div class="station">
<section class="guide" aria-labelledby="guide-title"><div class="mac-identity"><div class="mac-symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="5" y="6" width="38" height="27" rx="4"/><path d="M24 33v9m-9 0h18M6 27h36"/></svg></div><div><p class="eyebrow" data-i18n="macLabel"></p><p id="mac" class="mac-name"></p></div></div><h2 id="guide-title" data-i18n="scan"></h2><ol class="steps"><li><span class="step-number">1</span><div><h3 data-i18n="step1"></h3><p data-i18n="step1Detail"></p></div></li><li><span class="step-number">2</span><div><h3 data-i18n="step2"></h3><p data-i18n="step2Detail"></p></div></li><li><span class="step-number">3</span><div><h3 data-i18n="step3"></h3><p data-i18n="step3Detail"></p></div></li></ol><div class="joined" id="joined" hidden><strong data-i18n="pairedTitle"></strong><p data-i18n="pairedSubtitle"></p></div></section>
<section id="pair-card" class="pair-card" aria-label="Pairing"><div class="qr-header"><img src="/motion-mark.svg" width="36" height="36" alt=""><span class="eyebrow" data-i18n="qrLabel"></span><span class="player-tag">P1</span></div><div class="qr-stage"><img id="qr" alt="One-time pairing QR code" width="420" height="420" hidden><div id="qr-placeholder" aria-hidden="true"><svg viewBox="0 0 80 80"><path d="M5 25V5h20m30 0h20v20M5 55v20h20m30 0h20V55"/></svg></div></div><p id="expiry" class="expiry" aria-live="off"></p><button id="copy" disabled><span class="t-icon-swap" data-state="a" aria-hidden="true"><svg class="t-icon" data-icon="a" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M15 8V4H4v11h4"/></svg><svg class="t-icon" data-icon="b" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span><span data-i18n="copy"></span></button><button id="renew" class="secondary" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M5 15a8 8 0 0 0 13 3"/></svg><span data-i18n="renew"></span></button><p id="feedback" role="status"></p><details><summary data-i18n="manual"></summary><textarea id="payload" readonly spellcheck="false" aria-label="Pairing code"></textarea></details></section>
</div>
<div class="error-box" id="error-box" hidden><p id="error" role="alert"></p><button class="secondary" id="retry" data-i18n="retry"></button></div>
<section class="devices-section" aria-labelledby="devices-title"><div class="section-title"><h2 id="devices-title" data-i18n="devices"></h2><span id="phone-count" class="muted"></span></div><div id="devices"></div></section>
<footer><img src="/motion-mark.svg" width="42" height="42" alt=""><div><strong data-i18n="footer"></strong><p data-i18n="privacy"></p><p><a href="https://github.com/mindavidev/joypad-air" data-i18n="credits">Built on Joypad Air by David García.</a></p></div></footer>
</main>
<dialog id="remove-dialog" aria-labelledby="remove-title" aria-describedby="remove-detail"><h2 id="remove-title" data-i18n="removeTitle"></h2><p id="remove-name"></p><p id="remove-detail" data-i18n="removeDetail"></p><form method="dialog"><button value="cancel" class="secondary" data-i18n="cancel" autofocus></button><button id="confirm-remove" value="confirm" class="danger" data-i18n="confirmRemove"></button></form></dialog>
</body></html>
