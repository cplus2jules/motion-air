name: Suggest a feature / Proponer una función
description: Describe something you would like Motion Air to do. / Describe algo que te gustaría poder hacer.
title: "[Idea] "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        English or Spanish is welcome. Explain the task you want to make easier; you do not need to design the solution.
        Puedes responder en español o inglés. Explica qué quieres hacer más fácilmente; no necesitas diseñar la solución.

        Check [existing ideas](https://github.com/cplus2jules/motion-air/issues) before opening another one.
        Revisa las [ideas existentes](https://github.com/cplus2jules/motion-air/issues) antes de crear otra.
  - type: textarea
    id: need
    attributes:
      label: What would you like to do? / ¿Qué te gustaría hacer?
      description: Tell us who this helps and what is difficult today. / Explica a quién ayudaría y qué resulta difícil ahora.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea / Tu idea
      description: Describe the change and give an example of using it. / Describe el cambio y un ejemplo de uso.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where would it help? / ¿Dónde ayudaría?
      multiple: true
      options:
        - iPhone
        - Android
        - Mac
        - Windows
        - Browser controller / Mando del navegador
        - Instructions or translations / Instrucciones o traducciones
        - All platforms or not sure / Todas las plataformas o no lo sé
  - type: textarea
    id: examples
    attributes:
      label: Examples or alternatives (optional) / Ejemplos o alternativas (opcional)
      description: Add a sketch, screenshot, or what you do now. Remove private details. / Añade un boceto, captura o lo que haces ahora. Oculta los datos privados.
  - type: textarea
    id: acceptance
    attributes:
      label: Success criteria / Cómo sabremos que funciona
      description: List the results a person should be able to see or try. / Enumera los resultados que una persona debería poder ver o probar.
      placeholder: |
        - [ ] A user can... / Una persona puede...
        - [ ] When..., the app... / Cuando..., la app...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and limits (optional) / Alcance y límites (opcional)
      description: What should this change include? What can wait? Link any related discussion. / ¿Qué debe incluir? ¿Qué puede esperar? Enlaza la conversación relacionada.
